# Batería 2 — cooperativa
identity:
  user_agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/126.0 Safari/537.36
  contact_email: ruben.quintupil@cenia.cl
compliance:
  respect_robots_txt: true
  default_crawl_delay: 2.5
  max_requests_per_domain: 40
  on_captcha: skip_and_log
  on_403_429: backoff_then_skip
fetching:
  timeout_seconds: 45
  max_retries: 3
  dynamic_detection:
    min_text_length: 400
    spa_markers:
    - __NEXT_DATA__
    - ng-app
    - data-reactroot
    - id="root"
    - id="app"
    - nuxt
  playwright:
    headless: true
    wait_until: networkidle
    extra_wait_ms: 2000
    scroll_passes: 3
    pdf_click_probe: true
discovery:
  max_depth: 2
  max_pages_per_site: 12
  max_listing_pages: 2
  follow_subdomains: false
  use_sitemaps: false
  content_hints:
  - /articulo
  - /article
  - /noticia
  - /news
  - /blog
  - /post
  - /publicacion
  - /paper
  - /doi
  - /informe
  - /comunicado
  - /abstract
  exclude_patterns:
  - /login
  - /signin
  - /cart
  - /checkout
  - /tag/
  - /etiqueta/
  - ?share=
  - /wp-admin
  - /feed
  - .jpg
  - .png
  - .gif
  - .css
  - .js
  - .ico
  - .svg
  - .mp4
  - .zip
  - /accounts/
  - /orcid
  - /annotations
  - /RestfulWebService
  - /developers
  - /downloads
extraction:
  min_words_for_valid_article: 80
  pdf:
    download: true
    max_size_mb: 60
    ocr_chars_per_page_threshold: 120
    ocr_image_coverage_threshold: 0.85
storage:
  base_dir: ./data_battery/cooperativa
  markdown_dir: markdown
  pdf_dir: pdfs
  metadata_dir: metadata
  ocr_pending_file: ocr_pending/ocr_queue.json
  master_index: metadata/index.json
seeds:
- https://www.cooperativa.cl/noticias/pais/
