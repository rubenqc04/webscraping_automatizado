# =========================================================
# Configuración de WebHarvest
# =========================================================

identity:
  # Identifícate honestamente. Muchos sitios permiten bots que se identifican.
  user_agent: "WebHarvestBot/1.0 (+mailto:tu-email@ejemplo.com; scraping académico/investigación)"
  contact_email: "tu-email@ejemplo.com"

compliance:
  respect_robots_txt: true        # NO desactivar: es la base legal/ética del crawler
  default_crawl_delay: 2.0        # segundos entre requests al mismo dominio (si robots no define uno)
  max_requests_per_domain: 500    # tope de seguridad por ejecución
  on_captcha: "skip_and_log"      # el bot NO resuelve captchas: registra y continúa
  on_403_429: "backoff_then_skip" # backoff exponencial y luego abandona el dominio

fetching:
  timeout_seconds: 30
  max_retries: 3
  # Umbrales del detector estático/dinámico
  dynamic_detection:
    min_text_length: 400          # si el HTML estático rinde menos texto, probar render JS
    spa_markers: ["__NEXT_DATA__", "ng-app", "data-reactroot", "id=\"root\"", "id=\"app\"", "nuxt"]
  playwright:
    headless: true
    wait_until: "networkidle"
    extra_wait_ms: 1500           # espera extra para lazy-loading
    scroll_passes: 3
    # Sonda de acciones "PDF" sin href (botones JS): clic + captura de la
    # descarga. Actívala en sitios donde el PDF no es un enlace normal.
    pdf_click_probe: false              # scrolls para disparar carga diferida

discovery:
  # mode: "sections"              # portada -> secciones -> profundizar c/u
  # max_sections: 8                #   (solo en modo sections)
  # max_pages_per_section: 8       #   presupuesto por sección
  # mode: "auto"                 # el planner elige estrategia por semilla
  # exhaustive: true              # sin topes de profundidad/paginación (rieles: saturación + presupuesto)
  # saturation_window: 25         # N páginas sin doc nuevo -> el sitio se cierra solo
  # llm:                          # árbitro opcional para portadas ambiguas
  #   enabled: true
  #   endpoint: "http://localhost:8811"
  #   model: "qwen2.5-32b-instruct"
  max_depth: 2                    # profundidad de crawl desde las semillas
  max_pages_per_site: 200
  follow_subdomains: false
  use_sitemaps: true
  # Patrones de URL que suelen ser contenido (se priorizan)
  content_hints: ["/articulo", "/article", "/noticia", "/news", "/blog", "/post", "/publicacion", "/paper", "/doi", "/informe", "/comunicado"]
  # Patrones a excluir
  exclude_patterns: ["/login", "/signin", "/cart", "/checkout", "/tag/", "/etiqueta/", "?share=", "/wp-admin", "/feed", ".jpg", ".png", ".gif", ".css", ".js", ".ico", ".svg", ".mp4", ".zip"]

extraction:
  min_words_for_valid_article: 80     # descarta páginas de navegación / vacías
  pdf:
    download: true
    max_size_mb: 60
    # Detección de necesidad de OCR:
    ocr_chars_per_page_threshold: 120   # < 120 chars/página promedio => probablemente escaneado
    ocr_image_coverage_threshold: 0.85  # >85% del área de página cubierta por imágenes => escaneado

storage:
  base_dir: "./data"
  markdown_dir: "markdown"
  pdf_dir: "pdfs"
  metadata_dir: "metadata"
  ocr_pending_file: "ocr_pending/ocr_queue.json"
  master_index: "metadata/index.json"

seeds:
  # URLs iniciales a procesar (páginas concretas o portadas de sitios)
  - "https://ejemplo-noticias.com"
  - "https://ejemplo-gubernamental.gob/informes"
