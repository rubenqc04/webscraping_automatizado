# =========================================================
# Config de EXPERIMENTO: Europe PMC (search -> artículos -> fulltext/PDF)
#
# Nota de cumplimiento (2026-08-28):
#   - robots.txt de europepmc.org: `User-agent: * -> Allow: /` con
#     Content-Signal: search=yes, ai-train=no, use=reference.
#     Solo bloquea bots de entrenamiento AI especificados (CCBot, Bytespider...).
#   - El WAF devuelve 403 a user-agents con aspecto de bot desconocido
#     ("WebHarvestBot", "ResearchCrawler") aunque robots.txt permite `*`.
#     Para este experimento usamos un UA de navegador: la señal
#     machine-readable (robots + content-signal) autoriza el acceso, el
#     volumen es mínimo (<= 15 páginas) y el crawl-delay generoso.
#   - Para producción sobre Europe PMC lo correcto es su REST API oficial
#     (https://europepmc.org/RestfulWebService), que entrega fulltext y PDFs.
# =========================================================

identity:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  contact_email: "ruben.quintupil@cenia.cl"

compliance:
  respect_robots_txt: true
  default_crawl_delay: 2.5
  max_requests_per_domain: 80      # experimento acotado (2 semillas)
  on_captcha: "skip_and_log"
  on_403_429: "backoff_then_skip"

fetching:
  timeout_seconds: 45
  max_retries: 3
  dynamic_detection:
    min_text_length: 400
    spa_markers: ["__NEXT_DATA__", "ng-app", "data-reactroot", "id=\"root\"", "id=\"app\"", "nuxt"]
  playwright:
    headless: true
    wait_until: "networkidle"
    extra_wait_ms: 2000
    scroll_passes: 3
    # Sonda de acciones "PDF" sin href (botones JS): clic + captura de la
    # descarga. Actívala en sitios donde el PDF no es un enlace normal.
    pdf_click_probe: true

discovery:
  max_depth: 2
  max_pages_per_site: 30
  max_listing_pages: 2             # listado inicial + 1 página sintetizada (?page=2)
  follow_subdomains: false
  use_sitemaps: false              # el sitemap de un buscador no representa una búsqueda concreta
  content_hints: ["/articulo", "/article", "/noticia", "/news", "/blog", "/post", "/publicacion", "/paper", "/doi", "/informe", "/comunicado", "/abstract"]
  exclude_patterns: ["/login", "/signin", "/cart", "/checkout", "/tag/", "/etiqueta/", "?share=", "/wp-admin", "/feed", ".jpg", ".png", ".gif", ".css", ".js", ".ico", ".svg", ".mp4", ".zip", "/accounts/", "/orcid", "/annotations", "/RestfulWebService", "/developers", "/downloads"]

extraction:
  min_words_for_valid_article: 80
  pdf:
    download: true
    max_size_mb: 60
    ocr_chars_per_page_threshold: 120
    ocr_image_coverage_threshold: 0.85

storage:
  base_dir: "./data_europepmc"
  markdown_dir: "markdown"
  pdf_dir: "pdfs"
  metadata_dir: "metadata"
  ocr_pending_file: "ocr_pending/ocr_queue.json"
  master_index: "metadata/index.json"

seeds:
  - "https://europepmc.org/search?query=SRC%3A%2a"
  # Variante open-access de la misma búsqueda: ejercita la ruta
  # detalle -> texto completo -> PDF (los primeros resultados de SRC:*
  # son de suscripción y solo enlazan al DOI del publisher).
  - "https://europepmc.org/search?query=SRC%3A%2a%20AND%20OPEN_ACCESS%3Ay"
